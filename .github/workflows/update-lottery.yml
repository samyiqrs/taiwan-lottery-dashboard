name: Update lottery data

on:
  schedule:
    # 22:30 Asia/Taipei (UTC+8); leaves time for official results to settle.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh official draw data and generated site
        run: python scripts/update_lottery.py

      - name: Commit updated files
        run: |
          if git diff --quiet; then
            echo "No lottery data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "台灣彩券號碼推薦器.html" "台灣彩券分析報告.xlsx" latest_official_draws.json "演算法審查與UI優化建議.md"
          git commit -m "data: update Taiwan Lottery draws"
          git push
